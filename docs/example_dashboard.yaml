# Example: minimal dashboard for the kid's tablet.
# The morning-routine-card is invisible when no step is active,
# so the rest of this view is what shows the rest of the day.

views:
  - title: Home
    path: home
    cards:
      - type: custom:morning-routine-card
        active_step_entity: sensor.morning_routine_active_step
        tint_mode: mask
        # language: lb       # uncomment to force Lëtzebuergesch
      - type: vertical-stack
        cards:
          - type: weather-forecast
            entity: weather.home
          - type: entities
            title: Standard
            entities:
              - light.living_room
              - media_player.kitchen
