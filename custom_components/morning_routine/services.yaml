skip_step:
  name: Skip current step
  description: End the currently active step immediately and move on.

start_now:
  name: Start routine now
  description: Begin the routine starting from the first step regardless of clock time.

reset_snooze:
  name: Reset snooze / start_now offset
  description: >
    Clear any time shift introduced by `start_now` or `snooze` so the routine
    returns to its real clock-time schedule. Auto-fires after the (shifted)
    routine has played its last step of the day, but you can call it manually
    to abort an active test.

snooze:
  name: Snooze
  description: Postpone the routine by N minutes.
  fields:
    minutes:
      name: Minutes
      description: How many minutes to push the routine forward.
      default: 5
      selector:
        number:
          min: 1
          max: 60
          step: 1
          unit_of_measurement: min

set_steps:
  name: Set step list
  description: >
    Replace the entire morning routine. Used internally by the in-card editor —
    you can also call it from automations to switch between routines.
  fields:
    steps:
      name: Steps
      description: >
        List of step dicts with name, name_lb, start, duration, image, days and
        holiday_mode (always | skip_holiday | only_holiday, default always).
      required: true
      example: |
        - name: Coffee
          name_lb: Kaffi
          start: "07:30"
          duration: 15
          image: "☕"
          days: [mon, tue, wed, thu, fri]
          holiday_mode: always
        - name: School bus
          name_lb: Bus
          start: "07:50"
          duration: 10
          image: "🚌"
          days: [mon, tue, wed, thu, fri]
          holiday_mode: skip_holiday
      selector:
        object: {}

set_holiday:
  name: Set holiday period
  description: >
    Set or clear the manual holiday period. One date on its own means that
    single day, reversed dates are swapped, and calling it without any date
    clears the period. Used by the holiday dialog in the card.
  fields:
    start:
      name: Holiday from
      description: First day of the holiday (YYYY-MM-DD). Leave empty to clear.
      example: "2026-08-01"
      selector:
        text:
    end:
      name: Holiday until
      description: Last day of the holiday, included (YYYY-MM-DD).
      example: "2026-08-31"
      selector:
        text:
